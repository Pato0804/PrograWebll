<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historia</title>
    <link rel="stylesheet" href="../CSS/navbar.css">
    <link rel="stylesheet" href="../CSS/history.css">
        <link rel="stylesheet" href="../CSS/home.css">
</head>
<body>

    <nav class="navbar">
    <div class="nav-container">
        <div class="nav-links">
            <a href="home.html">Inicio</a>
            <a href="explore.html">Explorar</a>
            <a href="profile.html">Perfil</a>
            <a href="friendship.html">Personas</a>
            <a href="history.html" class="active">Historial</a>
            <a href="login.html" style="margin-left: 15px;">Cerrar sesión</a>
            
            <div class="notifications-container">
                <button id="notif-bell" class="bell-btn">
                    🔔<span id="notif-count" class="notif-badge" style="display:none;">0</span>
                </button>
                <div id="notif-dropdown" class="notif-dropdown">
                    <div class="dropdown-header">Notificaciones</div>
                    <div id="notif-list">
                        <p style="padding: 15px; text-align: center; color: #666; margin: 0;">Cargando...</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="nav-search">
            <input type="text" placeholder="Buscar...">
            <button type="button">🔍</button>
        </div>
    </div>
</nav>

    <div class="filter-section">
        <div class="filter-card">
            <div class="filter-group">
                <label>País Sede</label>
                <input type="text" placeholder="Ej: México, Brasil...">
            </div>
            <div class="filter-group">
                <label>Año Desde</label>
                <input type="number" placeholder="1930">
            </div>
            <div class="filter-group">
                <label>Año Hasta</label>
                <input type="number" placeholder="2026">
            </div>
            <button class="btn-buscar">Filtrar Historial</button>
        </div>
    </div>

<main class="mundiales-grid" id="world-cups-container">
        </main>

<script>
    const loggedUserId = localStorage.getItem('userId');
    const token = localStorage.getItem('token');

    if (!loggedUserId || !token) {
        window.location.href = 'login.html';
    }

    const authHeaders = {
        'Authorization': `Bearer ${token}`
    };

    async function loadWorldCups() {
        const container = document.getElementById('world-cups-container');
        try {
            const resSubs = await fetch(`http://localhost:3000/subscriptions/user/${loggedUserId}`, { headers: authHeaders });
            const subs = await resSubs.json();
            const subscribedIds = subs.map(s => s.id_world_cup);

            const resCups = await fetch('http://localhost:3000/worldcups', { headers: authHeaders });
            const allCups = await resCups.json();

            const myCups = allCups.filter(cup => subscribedIds.includes(cup.id_world_cup));
            container.innerHTML = '';

            if (myCups.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px;">
                        <p>Aún no sigues ningún mundial.</p>
                        <a href="explore.html" style="color: #1B365D; font-weight: bold;">¡Ve a explorar y sigue tus favoritos!</a>
                    </div>`;
                return;
            }

            myCups.forEach(worldCup => {
                const year = worldCup.date ? worldCup.date.split('-')[0] : 'Unknown';
                const card = document.createElement('div');
                card.className = 'mundial-card'; 
                card.innerHTML = `
                    <img src="${worldCup.image_url}" class="mundial-foto" onerror="this.src='https://placehold.co/640x360/1B365D/FFFFFF?text=${worldCup.name}'">
                    <div class="card-content">
                        <h3>${worldCup.name.toUpperCase()}</h3>
                        <p>${worldCup.description || 'Sin descripción.'}</p>
                        <a href="../HTML/worldcup-details.html?year=${year}" class="btn-ver">Ver detalles y comentarios</a>
                    </div>
                `;
                container.appendChild(card);
            });
        } catch (error) {
            console.error('Error:', error);
            container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: red;">Error al conectar con el servidor.</p>';
        }
    }

    async function fetchNotifications() {
        const list = document.getElementById('notif-list');
        const badge = document.getElementById('notif-count');
        try {
            const res = await fetch(`http://localhost:3000/notifications/user/${loggedUserId}`, { headers: authHeaders });
            const myNotifs = await res.json();
            const unread = myNotifs.filter(n => !n.is_read);

            if (unread.length > 0) {
                badge.innerText = unread.length;
                badge.style.display = 'block';
            }

            if (myNotifs.length > 0) {
                list.innerHTML = myNotifs.map(n => `
                    <div class="notif-item ${n.is_read ? '' : 'unread'}">
                        <strong>${n.type.toUpperCase()}</strong>: ${n.message}
                        <div style="font-size: 0.7rem; color: #999; margin-top: 5px;">
                            ${new Date(n.created_at).toLocaleDateString()}
                        </div>
                    </div>
                `).join('');
            }
        } catch (err) {
            console.error("Error al cargar notificaciones:", err);
        }
    }

    const bellBtn = document.getElementById('notif-bell');
    const dropdown = document.getElementById('notif-dropdown');
    if (bellBtn && dropdown) {
        bellBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
        });
        document.addEventListener('click', () => {
            if (dropdown.style.display === 'block') dropdown.style.display = 'none';
        });
        dropdown.addEventListener('click', (e) => { e.stopPropagation(); });
    }

    async function fetchNotificationsSilently() {
        if (!loggedUserId) return;
        const list = document.getElementById('notif-list');
        const badge = document.getElementById('notif-count');
        try {
            const res = await fetch(`http://localhost:3000/notifications/user/${loggedUserId}`, { headers: authHeaders });
            const myNotifs = await res.json();
            const unread = myNotifs.filter(n => !n.is_read);

            if (unread.length > 0) {
                badge.innerText = unread.length;
                badge.style.display = 'block';
            } else {
                badge.style.display = 'none';
            }

            if (myNotifs.length > 0) {
                list.innerHTML = myNotifs.map(n => `
                    <div class="notif-item ${n.is_read ? '' : 'unread'}" style="padding: 10px; border-bottom: 1px solid #eee; background-color: ${n.is_read ? 'white' : '#f0f8ff'};">
                        <strong>${n.type ? n.type.toUpperCase() : 'AVISO'}</strong>: ${n.message}
                        <div style="font-size: 0.7rem; color: #999; margin-top: 5px;">
                            ${new Date(n.created_at).toLocaleDateString()}
                        </div>
                    </div>
                `).join('');
            } else {
                list.innerHTML = '<p style="padding: 15px; text-align: center; color: #666; margin: 0;">No hay Notificaciones Nuevas</p>';
            }
        } catch (err) {
            console.error("Error al cargar notificaciones:", err);
            if (list) list.innerHTML = '<p style="padding: 15px; text-align: center; color: red;">Error de conexión</p>';
        }
    }

    loadWorldCups();
    fetchNotificationsSilently();
    fetchNotifications();
</script>
<script src="search.js"></script>
</body>
</html>
