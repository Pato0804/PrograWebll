<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MundiConnect - Explorar Mundiales</title>
    <link rel="stylesheet" href="../CSS/navbar.css">
    <link rel="stylesheet" href="../CSS/home.css">
    <style>
        body { background-color: #F0F2F5; margin: 0; padding-top: 80px; font-family: Arial, sans-serif; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .world-cup-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .world-cup-img { width: 100%; height: 200px; object-fit: cover; }
        .world-cup-info { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .world-cup-title { font-size: 1.5em; color: #1B365D; margin: 0 0 10px 0; }
        .world-cup-host { font-weight: bold; color: #2D5A27; margin-bottom: 10px; }
        .world-cup-desc { color: #666; margin-bottom: 20px; flex-grow: 1; }
        .btn-subscribe { padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; transition: 0.3s; width: 100%; }
        .btn-blue { background-color: #1B365D; } /* Para Seguir */
        .btn-blue:hover { background-color: #2a528c; }
        .btn-red { background-color: #dc3545; } /* Para Dejar de seguir */
        .btn-red:hover { background-color: #c82333; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <div class="nav-links">
            <a href="home.html">Inicio</a>
            <a href="explore.html"class="active">Explorar</a>
            <a href="profile.html">Perfil</a>
            <a href="friendship.html">Personas</a>
            <a href="history.html">Historial</a>
            <a href="login.html" style="margin-left: 15px;">Cerrar sesión</a>
            
            <div class="notifications-container">
                <button id="notif-bell" class="bell-btn">
                    🔔<span id="notif-count" class="notif-badge" style="display:none;">0</span>
                </button>
                <div id="notif-dropdown" class="notif-dropdown">
                    <div class="dropdown-header">Notificaciones</div>
                    <div id="notif-list">
                        <p style="padding: 15px; text-align: center; color: #666; margin: 0;">Cargando...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>

    <main class="grid-container" id="world-cups-grid">
        <p style="text-align: center; grid-column: 1/-1;">Cargando catálogo de mundiales...</p>
    </main>

<script>
    const loggedUserId = localStorage.getItem('userId');
    const token = localStorage.getItem('token');

    if (!loggedUserId || !token) {
        window.location.href = 'login.html';
    }

    const authHeaders = {
        'Authorization': `Bearer ${token}`
    };
    
    const authHeadersJSON = {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
    };

    let userSubscriptions = [];

    async function initializePage() {
        await loadSubscriptions();
        await loadWorldCups();   
    }

    async function loadSubscriptions() {
        try {
            const response = await fetch(`http://localhost:3000/subscriptions/user/${loggedUserId}`, { headers: authHeaders });
            if (response.ok) {
                const subs = await response.json();
                userSubscriptions = subs.map(s => s.id_world_cup);
            }
        } catch (error) {
            console.error("Error al cargar suscripciones", error);
        }
    }

    async function loadWorldCups() {
        const grid = document.getElementById('world-cups-grid');
        try {
            const response = await fetch('http://localhost:3000/worldcups', { headers: authHeaders });
            const worldCups = await response.json();
            
            grid.innerHTML = ''; 

            worldCups.forEach(cup => {
                const isSubscribed = userSubscriptions.includes(cup.id_world_cup);
                const buttonClass = isSubscribed ? 'btn-red' : 'btn-blue';
                const buttonText = isSubscribed ? 'Dejar de Seguir' : 'Seguir Mundial';
                const imagenSegura = cup.image_url ? cup.image_url : `https://placehold.co/600x400/1B365D/FFFFFF?text=${cup.name}`;
                
                grid.innerHTML += `
                    <div class="world-cup-card">
                        <img src="${imagenSegura}" class="world-cup-img" onerror="this.src='https://placehold.co/600x400/1B365D/FFFFFF?text=Error'">
                        <div class="world-cup-info">
                            <h2 class="world-cup-title">${cup.name}</h2>
                            <p class="world-cup-host">Sede: ${cup.host}</p>
                            <button class="btn-subscribe ${buttonClass}" 
                                    onclick="toggleSubscription(${cup.id_world_cup}, this)">
                                    ${buttonText}
                            </button>
                        </div>
                    </div>`;
            });
        } catch (error) {
            grid.innerHTML = '<p style="color: red;">Error al cargar el catálogo. ¿Está encendido Node.js?</p>';
        }
    }

    async function toggleSubscription(worldCupId, buttonElement) {
        buttonElement.disabled = true;
        const isCurrentlySubscribed = userSubscriptions.includes(worldCupId);
        
        try {
            if (isCurrentlySubscribed) {
                const res = await fetch('http://localhost:3000/subscriptions', {
                    method: 'DELETE',
                    headers: authHeadersJSON,
                    body: JSON.stringify({ id_user: loggedUserId, id_world_cup: worldCupId })
                });
                if (res.ok) {
                    userSubscriptions = userSubscriptions.filter(id => id !== worldCupId);
                    buttonElement.className = 'btn-subscribe btn-blue';
                    buttonElement.innerText = 'Seguir Mundial';
                }
            } else {
                const res = await fetch('http://localhost:3000/subscriptions', {
                    method: 'POST',
                    headers: authHeadersJSON,
                    body: JSON.stringify({ id_user: loggedUserId, id_world_cup: worldCupId })
                });
                if (res.ok) {
                    userSubscriptions.push(worldCupId);
                    buttonElement.className = 'btn-subscribe btn-red';
                    buttonElement.innerText = 'Dejar de Seguir';
                }
            }
        } catch (error) {
            alert('Error al procesar la solicitud.');
        }
        buttonElement.disabled = false;
    }

    const bellBtn = document.getElementById('notif-bell');
    const dropdown = document.getElementById('notif-dropdown');
    if (bellBtn && dropdown) {
        bellBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
        });
        document.addEventListener('click', () => {
            if (dropdown.style.display === 'block') dropdown.style.display = 'none';
        });
        dropdown.addEventListener('click', (e) => { e.stopPropagation(); });
    }

    async function fetchNotificationsSilently() {
        if (!loggedUserId) return;
        const list = document.getElementById('notif-list');
        const badge = document.getElementById('notif-count');
        try {
            const res = await fetch(`http://localhost:3000/notifications/user/${loggedUserId}`, { headers: authHeaders });
            const myNotifs = await res.json();
            const unread = myNotifs.filter(n => !n.is_read);

            if (unread.length > 0) {
                badge.innerText = unread.length;
                badge.style.display = 'block';
            } else {
                badge.style.display = 'none';
            }

            if (myNotifs.length > 0) {
                list.innerHTML = myNotifs.map(n => `
                    <div class="notif-item ${n.is_read ? '' : 'unread'}" style="padding: 10px; border-bottom: 1px solid #eee; background-color: ${n.is_read ? 'white' : '#f0f8ff'};">
                        <strong>${n.type ? n.type.toUpperCase() : 'AVISO'}</strong>: ${n.message}
                        <div style="font-size: 0.7rem; color: #999; margin-top: 5px;">
                            ${new Date(n.created_at).toLocaleDateString()}
                        </div>
                    </div>
                `).join('');
            } else {
                list.innerHTML = '<p style="padding: 15px; text-align: center; color: #666; margin: 0;">No hay Notificaciones Nuevas</p>';
            }
        } catch (err) {
            console.error("Error al cargar notificaciones:", err);
            if (list) list.innerHTML = '<p style="padding: 15px; text-align: center; color: red;">Error de conexión</p>';
        }
    }

    fetchNotificationsSilently();
    initializePage();
</script>
</body>
</html>
